name: Unpack BAH rate files

# What this job is for
# The Military tab looks up BAH by ZIP code from four Department of Defense text files.
# The Defense Travel site turns away automated requests, so this job does not fetch anything.
# Once a year, in January:
#   1. In a browser open travel.dod.mil, Allowances, Basic Allowance for Housing, BAH Rate Lookup.
#   2. Scroll to ALL BAH RATES, pick File Type ASCII and the year, click Submit.
#      A file named like BAH-ASCII-2027.zip downloads.
#   3. In this repository click Add file, Upload files, drag that ZIP file in, click Commit changes.
# This job starts by itself when the ZIP file arrives. It unpacks the four text files the app
# reads, checks them, and saves them next to app.py. The app restarts on its own.

on:
  push:
    branches: [main]
    paths:
      - "BAH-ASCII-*.zip"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and check the newest BAH file
        run: |
          set -euo pipefail
          ZIP="$(ls BAH-ASCII-20[0-9][0-9].zip 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "There is no BAH-ASCII-<year>.zip in the repository, so there is nothing to unpack."
            echo "FOUND=no" >> "$GITHUB_ENV"
            exit 0
          fi
          YEAR="${ZIP:10:4}"
          YY="${YEAR:2:2}"
          echo "Unpacking $ZIP for $YEAR"
          OUT="$RUNNER_TEMP/bah"
          mkdir -p "$OUT"
          unzip -o -j "$ZIP" "bahw${YY}.txt" "bahwo${YY}.txt" "sorted_zipmha${YY}.txt" -d "$OUT"
          unzip -o -j "$ZIP" "mhanames${YY}.txt" -d "$OUT" || echo "No names file in this year's package. The app works without it."

          # Refuse anything that does not look like a full set, so a bad file never reaches the app.
          for f in "bahw${YY}.txt" "bahwo${YY}.txt"; do
            rows=$(grep -Ec '^[A-Z]{2}[0-9]{3},' "$OUT/$f" || true)
            short=$(awk -F, 'NF > 0 && NF < 25' "$OUT/$f" | wc -l)
            echo "$f: $rows rate rows, $short short rows"
            if [ "$rows" -lt 300 ] || [ "$short" -ne 0 ]; then
              echo "$f does not look right. Nothing was saved."
              exit 1
            fi
          done
          zips=$(grep -Ec '^[0-9]{5} [A-Z]{2}[0-9]{3}' "$OUT/sorted_zipmha${YY}.txt" || true)
          echo "sorted_zipmha${YY}.txt: $zips ZIP codes"
          if [ "$zips" -lt 30000 ]; then
            echo "The ZIP code list does not look right. Nothing was saved."
            exit 1
          fi

          # The names file puts a semicolon after the area code. The app's reader expects a comma there.
          if [ -f "$OUT/mhanames${YY}.txt" ]; then
            sed -i 's/;/,/' "$OUT/mhanames${YY}.txt"
          fi

          cp "$OUT"/*.txt "$GITHUB_WORKSPACE/"
          echo "FOUND=yes" >> "$GITHUB_ENV"
          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "YY=$YY" >> "$GITHUB_ENV"

      - name: Commit and push if changed
        if: env.FOUND == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bahw${YY}.txt" "bahwo${YY}.txt" "sorted_zipmha${YY}.txt"
          if [ -f "mhanames${YY}.txt" ]; then git add "mhanames${YY}.txt"; fi
          git diff --cached --quiet && echo "No changes" || (git commit -m "Unpack Department of Defense BAH rate files for ${YEAR}" && git push)
