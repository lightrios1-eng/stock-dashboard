name: Refresh BAH rate files

# Fetches the Department of Defense "All BAH Rates" file for one year and saves the
# four text files the Military tab reads. Run it from the Actions tab: pick this job,
# click "Run workflow", leave the year empty for the current year, click the green button.
# BAH rates are set once a year and take effect on January 1.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Rate year, four digits. Leave empty for this year."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the file and unpack it
        env:
          YEAR_INPUT: ${{ inputs.year }}
        run: |
          set -euo pipefail
          YEAR="${YEAR_INPUT:-}"
          if [ -z "$YEAR" ]; then YEAR="$(date -u +%Y)"; fi
          if ! echo "$YEAR" | grep -Eq '^20[0-9]{2}$'; then
            echo "The year must be four digits, for example 2026."
            exit 1
          fi
          YY="${YEAR:2:2}"
          URL="https://www.travel.dod.mil/Portals/119/Documents/BAH/BAH_Rates_All_Locations_All_Pay_Grades/ASCII/BAH-ASCII-${YEAR}.zip"
          echo "Fetching $URL"
          if ! curl --fail --silent --show-error --location --retry 2 --max-time 120 \
              --user-agent "stock-dashboard BAH refresh (github.com/${GITHUB_REPOSITORY})" \
              --output "$RUNNER_TEMP/bah.zip" "$URL"; then
            echo "The Defense Travel site did not hand over the file. Either it turns away automated requests or the ${YEAR} rates are not published yet."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bah"
          unzip -o -j "$RUNNER_TEMP/bah.zip" "bahw${YY}.txt" "bahwo${YY}.txt" "sorted_zipmha${YY}.txt" -d "$RUNNER_TEMP/bah"
          unzip -o -j "$RUNNER_TEMP/bah.zip" "mhanames${YY}.txt" -d "$RUNNER_TEMP/bah" || echo "No names file in this year's package. The app works without it."
          cd "$RUNNER_TEMP/bah"

          # Refuse anything that does not look like a full set, so a bad download never reaches the app.
          for f in "bahw${YY}.txt" "bahwo${YY}.txt"; do
            rows=$(grep -Ec '^[A-Z]{2}[0-9]{3},' "$f" || true)
            short=$(awk -F, 'NF > 0 && NF < 25' "$f" | wc -l)
            echo "$f: $rows rate rows, $short short rows"
            if [ "$rows" -lt 300 ] || [ "$short" -ne 0 ]; then
              echo "$f does not look right. Nothing was saved."
              exit 1
            fi
          done
          zips=$(grep -Ec '^[0-9]{5} [A-Z]{2}[0-9]{3}' "sorted_zipmha${YY}.txt" || true)
          echo "sorted_zipmha${YY}.txt: $zips ZIP codes"
          if [ "$zips" -lt 30000 ]; then
            echo "The ZIP code list does not look right. Nothing was saved."
            exit 1
          fi

          # The names file puts a semicolon after the area code. The app's reader expects a comma there.
          if [ -f "mhanames${YY}.txt" ]; then
            sed -i 's/;/,/' "mhanames${YY}.txt"
          fi

          cp ./*.txt "$GITHUB_WORKSPACE/"
          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "YY=$YY" >> "$GITHUB_ENV"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bahw${YY}.txt" "bahwo${YY}.txt" "sorted_zipmha${YY}.txt"
          if [ -f "mhanames${YY}.txt" ]; then git add "mhanames${YY}.txt"; fi
          git diff --cached --quiet && echo "No changes" || (git commit -m "Refresh Department of Defense BAH rate files for ${YEAR}" && git push)
